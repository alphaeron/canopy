# Publishes the documentation site (internal/docgen) to GitHub Pages whenever
# its sources change on main: the Markdown documents, the CLI's commands, the
# RULES schema the RULES reference is checked against, or the shared theme.
# The site is generated here rather than committed, so it cannot fall out of
# date with the code. The repository's Pages source must be set to GitHub
# Actions (Settings → Pages).
name: pages

on:
  push:
    branches: [main]
    paths:
      - CONTRIBUTING.md
      - docs/**
      - internal/platform/README.md
      - internal/cli/**
      - internal/rulesfile/**
      - internal/docgen/**
      - internal/reviewview/theme.css
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the site
        run: go run ./internal/docgen -out build/docs -version "main@${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
